# Build Vulkan llama-cpp-python wheels for the ELI GPU pack (AMD / Intel Arc).
#
# No official prebuilt Vulkan wheels exist upstream, so this compiles them:
#   windows-latest + ubuntu-latest, python 3.11 (same as the frozen app),
#   CMAKE_ARGS=-DGGML_VULKAN=on, and publishes them (renamed vulkan-*.whl) to
#   the `gpu-packs` pre-release. eli_gpu_pack.py downloads from there when it
#   detects an AMD GPU (or with --vulkan).
#
# Runtime needs only the Vulkan loader, which AMD/Intel/NVIDIA drivers ship;
# glslc/the SDK are build-time-only. Re-run manually to refresh the wheels.

name: gpu-packs

on:
  workflow_dispatch:
    inputs:
      llama_version:
        description: "llama-cpp-python version to build"
        # Must stay >= 0.3.30. Below that llama.cpp cannot read hybrid
        # attention+SSM GGUFs (qwen35, nemotron-h) -- they fail on a missing
        # ssm_conv1d tensor. The packs built here are what NVIDIA falls back to
        # when the abetlen CUDA index is too old (it stops at 0.3.19), so a
        # stale default here silently caps what the shipped app can load.
        default: "0.3.35"
        required: true

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"   # must match the frozen app's interpreter

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Vulkan SDK (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # spirv-headers/glslang-tools became REQUIRED by llama.cpp's Vulkan
          # backend after 0.3.19 (cmake fails with: Could not find a package
          # configuration file provided by "SPIRV-Headers"). The old pin hid
          # that, so bumping the version broke this step.
          sudo apt-get install -y libvulkan-dev glslc spirv-headers spirv-tools glslang-tools || {
            echo "::error::Vulkan build deps unavailable - Vulkan build cannot proceed"; exit 1; }
          glslc --version

      - name: Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl.exe -fsSL -o vulkan_sdk.exe https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe
          Start-Process -Wait -FilePath .\vulkan_sdk.exe -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install"
          $sdk = (Get-ChildItem C:\VulkanSDK | Sort-Object Name -Descending | Select-Object -First 1).FullName
          if (-not $sdk) { Write-Error "Vulkan SDK install failed"; exit 1 }
          echo "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          echo "$sdk\Bin" >> $env:GITHUB_PATH

      - name: Build Vulkan wheel
        shell: bash
        env:
          CMAKE_ARGS: "-DGGML_VULKAN=on"
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel cmake ninja
          python -m pip wheel "llama-cpp-python==${{ inputs.llama_version }}" \
            --no-deps --no-binary llama-cpp-python -w wheelhouse
          ls -lh wheelhouse
          for f in wheelhouse/llama_cpp_python-*.whl; do
            mv "$f" "wheelhouse/vulkan-$(basename "$f")"
          done
          ls -lh wheelhouse

      - name: Sanity — wheel contains the Vulkan backend
        shell: bash
        run: |
          python - <<'EOF'
          import glob, sys, zipfile
          whl = glob.glob("wheelhouse/vulkan-*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          hits = [n for n in names if "vulkan" in n.lower()]
          print("vulkan artifacts in wheel:", hits or "NONE")
          sys.exit(0 if hits else 1)
          EOF

      - name: Publish to the gpu-packs pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gpu-packs
          name: "ELI GPU packs (Vulkan llama.cpp builds)"
          prerelease: true
          body: >
            CI-built Vulkan wheels of llama-cpp-python for the ELI GPU pack
            (AMD / Intel Arc). Installed automatically by
            `ELI --install-gpu-pack`; not meant for manual pip use.
          files: wheelhouse/vulkan-*.whl
          fail_on_unmatched_files: true

  build-cuda:
    # NVIDIA packs. Previously NVIDIA relied entirely on the abetlen wheel
    # index, which stops at 0.3.19 for several interpreters -- so a machine
    # with a perfectly good GPU ended up on a runtime that cannot read hybrid
    # attention+SSM GGUFs (qwen35, nemotron-h). Building here removes that
    # ceiling; the Vulkan pack stays as the fallback for AMD/Intel Arc.
    strategy:
      fail-fast: false
      matrix:
        # windows-2022, NOT windows-latest: the latest image ships Visual
        # Studio 2025, and CUDA 12.6's host_config.h hard-errors on it --
        # "unsupported Microsoft Visual Studio version! Only the versions
        # between 2017 and 2022 (inclusive) are supported". Pinning the runner
        # keeps a supported host compiler instead of forcing nvcc past its own
        # check with -allow-unsupported-compiler, which would build a wheel
        # nobody has validated.
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # The sub-package names differ per OS and the action does not normalise
      # them: on Linux cuBLAS ships as libcublas/libcublas-dev with no "cuda-"
      # prefix (hence non-cuda-sub-packages), and visual_studio_integration
      # exists only on Windows. A single shared list fails with
      # "Unable to locate package cuda-cublas-12-6".
      - name: CUDA toolkit (Linux)
        if: runner.os == 'Linux'
        uses: Jimver/cuda-toolkit@v0.2.29
        with:
          cuda: '12.6.3'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "thrust", "nvtx"]'
          non-cuda-sub-packages: '["libcublas", "libcublas-dev"]'

      - name: CUDA toolkit (Windows)
        if: runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@v0.2.29
        with:
          cuda: '12.6.3'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust", "visual_studio_integration"]'

      # CMake's default Windows generator is MSBuild, which needs CUDA's
      # .props/.targets copied into the Visual Studio BuildCustomizations
      # folder; the toolkit action does not do that, so the build dies with
      # "No CUDA toolset found" even though it just reported "CUDA Toolkit
      # found". Using Ninja with the MSVC environment loaded sidesteps the
      # MSBuild integration entirely (and builds faster).
      - name: MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h /

      - name: Build CUDA wheel
        shell: bash
        env:
          # The 7-architecture list built fine but produced a wheel over 2 GB,
          # which GitHub refuses as a release asset ("size must be less than
          # 2147483648"). Two changes bring it under: drop the datacenter-only
          # architectures (70=V100, 80=A100, 90=Hopper) that ELI's desktop
          # audience does not run, and use `-real` so each kept architecture
          # embeds cubin only rather than cubin PLUS PTX. One trailing
          # `-virtual` keeps forward compatibility: a future card with no cubin
          # JITs from that PTX instead of failing outright.
          #   61=Pascal (GTX 10xx)  75=Turing (RTX 20xx/GTX 16xx)
          #   86=Ampere (RTX 30xx)  89=Ada (RTX 40xx)
          CMAKE_ARGS: "-DGGML_CUDA=on -DCMAKE_CUDA_ARCHITECTURES=61-real;75-real;86-real;89-real;89-virtual"
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
          CMAKE_GENERATOR: "Ninja"
        run: |
          set -euo pipefail
          nvcc --version
          python -m pip install --upgrade pip wheel cmake ninja
          python -m pip wheel "llama-cpp-python==${{ inputs.llama_version }}" \
            --no-deps --no-binary llama-cpp-python -w wheelhouse
          for f in wheelhouse/llama_cpp_python-*.whl; do
            mv "$f" "wheelhouse/cuda-$(basename "$f")"
          done
          ls -lh wheelhouse

      - name: Sanity - wheel contains the CUDA backend and fits the asset limit
        shell: bash
        run: |
          python - <<'EOF'
          import glob, os, sys, zipfile
          whl = glob.glob("wheelhouse/cuda-*.whl")[0]
          size = os.path.getsize(whl)
          print(f"wheel size: {size/1e9:.2f} GB")
          # GitHub rejects release assets >= 2 GiB. Catching it here names the
          # cause; catching it at publish just says "Validation Failed".
          if size >= 2_147_483_648:
              print("::error::wheel exceeds the 2 GiB GitHub release-asset limit "
                    "- trim CMAKE_CUDA_ARCHITECTURES")
              sys.exit(1)
          names = zipfile.ZipFile(whl).namelist()
          hits = [n for n in names if "cuda" in n.lower() and n.lower().endswith((".so", ".dll"))]
          print("cuda artifacts in wheel:", hits or "NONE")
          # A wheel without the CUDA backend library is a CPU build wearing a
          # cuda- prefix; publishing it would silently disable acceleration.
          sys.exit(0 if hits else 1)
          EOF

      - name: Publish to the gpu-packs pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gpu-packs
          name: "ELI GPU packs (llama.cpp GPU builds)"
          prerelease: true
          body: >
            CI-built GPU wheels of llama-cpp-python for the ELI GPU pack:
            cuda-* for NVIDIA, vulkan-* for AMD / Intel Arc. Installed
            automatically by `ELI --install-gpu-pack`; not meant for manual
            pip use.
          files: wheelhouse/cuda-*.whl
          fail_on_unmatched_files: true
