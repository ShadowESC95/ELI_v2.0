# Automatic quarantine for marketplace submissions.
#
# A pull request IS the quarantine: the plugin is proposed, evaluated, and sits
# there unlisted until the maintainer merges it. Nothing a submitter can do makes
# a listing live — merging is the approval, and the signature added at publish is
# what users' machines actually check.
#
# This workflow runs the same checks a user's machine runs on the download, so a
# submission that would be refused there is refused here first, before anyone
# spends time reading it. It cannot approve: a green run means "no blocking
# findings, ready for a human", never "safe to merge".
name: Review submission

on:
  pull_request:
    paths:
      - "plugins/**"

# A fork PR runs untrusted code's *scanners*, not the code itself — but keep the
# token read-only regardless, so a malicious submission cannot write to the repo.
permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the registry
        uses: actions/checkout@v4

      - name: Check out ELI (for the review tooling)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ELI_REPO }}
          path: .eli
          ref: ${{ vars.ELI_REF || 'main' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scanners
        # The reviewer reports an unavailable engine as reduced coverage rather
        # than as a pass, so CI installs them to make the review its strongest.
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav yara
          sudo freshclam || echo "signature update failed; clamav will report reduced coverage"

      - name: Install ELI's plugin dependencies
        run: python -m pip install --upgrade pip cryptography

      - name: Identify changed submissions
        id: changed
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          dirs=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD \
                 | grep '^plugins/' | cut -d/ -f1,2 | sort -u)
          echo "dirs<<EOF" >> "$GITHUB_OUTPUT"
          echo "$dirs" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Review each submission
        run: |
          set -o pipefail
          rc=0
          while read -r d; do
            [ -z "$d" ] && continue
            echo "::group::$d"
            python .eli/tools/marketplace/review.py "$d" | tee -a review.txt || rc=1
            echo "::endgroup::"
          done <<< "${{ steps.changed.outputs.dirs }}"
          exit $rc

      - name: Post the verdict on the pull request
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = "No submission was evaluated.";
            try { body = fs.readFileSync('review.txt', 'utf8'); } catch (e) {}
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "### Automated review\n\n```\n" + body.slice(0, 60000) +
                    "\n```\n\nThis is not an approval. A maintainer still reads the " +
                    "code and signs it before it is listed."
            });
