[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eli-v2.0"
version = "2.5.40"
description = "ELI v2.0 — Local cognitive runtime, assistant GUI, memory, tools, and GGUF inference"
readme = "README.md"
requires-python = ">=3.10"
# Open source under the Apache License 2.0: LICENSE has the terms, NOTICE the copyright.
license = "Apache-2.0"
authors = [{ name = "Jason Fitzgibbon Bridgeman", email = "jaybridgeman0095@gmail.com" }]
keywords = ["ai", "assistant", "llm", "local", "gpu", "gguf"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: GPU :: NVIDIA CUDA",
    "Environment :: X11 Applications :: Qt",
]
# Everything ELI needs to run its features, on every system: a plain `pip install` of the project gives
# voice input and output, the window, the server, documents, vision, web search, wake words and the
# device drivers. An optional extra once held each of these, and what a user got depended on which
# extras the way they installed asked for. Only what cannot be installed the same way everywhere stays
# optional, below. tests/claims/test_runtime_dependencies.py holds every package eli/ and api/ import
# to this list.
dependencies = [
    "platformdirs>=4.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "requests>=2.28",
    "Pillow>=10.0",
    "mss>=9.0",
    "PyAutoGUI>=0.9.54",
    "pyttsx3>=2.9",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "psutil>=5.9",
    "tqdm>=4.64",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "numpy>=1.24,<2.5",  # numba (coqui-tts -> librosa) rejects NumPy 2.5
    "faiss-cpu>=1.7",
    "Jinja2>=3.1",        # the model's chat template (eli/cognition/chat_template.py)
    "tomli>=2.0.1; python_version<'3.11'",
    "comtypes>=1.2; sys_platform == 'win32'",
    "pycaw; sys_platform == 'win32'",
    "pywin32; sys_platform == 'win32'",   # Start-menu shortcuts (eli/runtime/desktop_launchers.py)
    # Window. GUI binding policy:
    #   PySide6 is the canonical Qt binding for ELI. It is licensed LGPLv3,
    #   which permits dynamic linking from proprietary or differently-licensed
    #   code (Python always loads C extensions dynamically), so the binding
    #   itself does not impose copyleft on the rest of this project.
    #
    #   PyQt6 is intentionally NOT a dependency here. PyQt6 is GPLv3 and would
    #   force the entire shipped binary to be GPL, blocking proprietary
    #   distribution. The runtime shim at eli/gui/qt_compat.py allows users
    #   who already have PyQt6/PyQt5 installed to run from source, but the
    #   packaged distribution must remain PySide6-only to honour the
    #   project license declared above.
    # 6.12.0 loses a reference to None on every Qt call on Python 3.11 and earlier, which aborts the
    # app ("deallocating None"); eli/core/singleton_refs.py guards it, builds should not ship it.
    "PySide6>=6.5,!=6.12.0; python_version < '3.12'",
    "PySide6>=6.5; python_version >= '3.12'",
    # Voice output
    "piper-tts>=1.2",
    "onnxruntime>=1.15",
    # Voice input. PyAudio has ready-made builds for Windows only; on Linux and macOS it is compiled
    # against PortAudio's headers (portaudio19-dev, portaudio-devel, `brew install portaudio`), which
    # install.sh adds first.
    "faster-whisper>=1.0",
    "SpeechRecognition>=3.10",
    "PyAudio>=0.2",
    # audioop left the stdlib in 3.13 (PEP 594) and ELI's mic path imports it;
    # on 3.13+ distros it previously arrived only as a transitive dep.
    'audioop-lts>=0.2.1; python_version >= "3.13"',
    # Wake word
    "openwakeword>=0.4",
    # Documents and reports
    "markdown>=3.5",
    "pdfplumber>=0.10",
    "pypdf>=4.0",
    "python-docx>=1.1",
    # Self-hosted REST + web chat UI (api/server.py) — the phone/web-app feature — and the device server.
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "websockets>=14.0",   # pinned explicitly — see requirements.txt for why
    "paho-mqtt>=1.6,<3",  # ELI-native MQTT device server (no Home Assistant)
    "zeroconf>=0.70",     # mDNS device/broker discovery
    "bleak>=0.21",        # Bluetooth (BLE) device discovery (degrades cleanly if no radio)
    "segno>=1.5",         # QR codes for Connect tab / phone pairing
    "cryptography>=41",   # self-signed LAN HTTPS cert (phone microphone)
    # Device drivers for what does not speak MQTT (eli/runtime/device_drivers.py). The dashboard's
    # one-click install runs pip, which a packaged app does not have, so they ship with ELI.
    "pychromecast>=13.0",     # Chromecast
    "androidtv[async]>=0.0.70",  # Fire TV / Android TV
    "adb-shell>=0.4",         # Fire TV / Android TV pairing keys
    "pyatv>=0.16",            # Apple TV / AirPlay (0.16 read tags with tinytag, not the GPL's mutagen)
    # Gaze cursor + on-screen OCR.
    "opencv-python>=4.8",
    "pytesseract>=0.3",
    # Web search + browser automation plugins.
    "ddgs>=9.0",
    "playwright>=1.40",
    # Data/CSV analysis + 2D/3D/4D plotting, simulation/dynamics, and 3D-mesh inspection.
    # scipy = ODE/PDE solvers, linear algebra, signal processing (the "dynamics"); plotly
    # = interactive 3D + time-animated (4D) figures; matplotlib(+mplot3d) = static 2D/3D;
    # meshio = STL/VTK/OBJ mesh I/O. This is the stack ELI's code agent runs to build sims.
    "pandas>=2.0",
    "matplotlib>=3.7",
    "meshio>=5.3",
    "scipy>=1.11",
    "plotly>=5.18",
    # HF downloads, desktop notifications, calendar, code lint.
    "huggingface-hub>=0.20",
    "plyer>=2.1",
    "ics>=0.7",
    "pyflakes>=3.0",
    # YouTube direct playback (Python side). mpv remains an OS package — install via
    # install.sh / grounded remediation when missing.
    "yt-dlp>=2025.1",
    # The plugin scanner's YARA engine (it runs the user's own ruleset). No build for Python 3.14 yet,
    # and from source it needs a compiler and OpenSSL's headers.
    'yara-python>=4.5; python_version < "3.14"',
]

[project.optional-dependencies]
# Only what cannot be installed the same way on every machine: each is built for, or chosen by, the
# machine's GPU, and the installers fetch it by a step of their own.
# The inference engine. PyPI has no ready-made build: the installers build it for the GPU they find
# (CUDA, Metal, ROCm, Vulkan or CPU), at the version packaging/llama_cpp_constraints.txt holds.
llm = [
    "llama-cpp-python>=0.3.35",
]
# Image generation. accelerate needs PyTorch, which the installers take from the index for this GPU.
image = [
    "diffusers>=0.20",
    "safetensors>=0.3",
    "accelerate>=0.20",
]
# Test-suite drivers (API subprocess tests, lint gates, MQTT probe). Cross-platform.
test = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "websockets>=14.0",   # pinned explicitly — see requirements.txt for why
    "httpx>=0.27",
    "paho-mqtt>=1.6,<3",
    "pyflakes>=3.0",
    "pytest>=7.0",
]
# Everything ELI uses at runtime — the one-click "complete" install.
full = [
    "eli-v2.0[llm,image]",
]
training = [
    "torch>=2.0",
    "transformers>=4.40",
    "peft>=0.10",
    "datasets>=2.18",
    "trl>=0.8",
    # 4-bit (QLoRA) lets a card too small for fp16 weights still train the adapter. NVIDIA on Linux
    # and Windows only: there is no macOS build, and the trainer falls back to fp16 without it.
    "bitsandbytes>=0.43; platform_system != 'Darwin'",
]
# Neural voice — Coqui XTTS-v2 (heavy, opt-in — NOT part of full). Powers BOTH the
# human-like `natural:` voices (built-in speakers, no clone) and `clone:` voice
# cloning. Downloads a ~1.8GB model on first use. See eli/perception/tts_xtts.py.
# coqui-tts is the maintained fork of the (unmaintained) TTS package; imports as `TTS`.
# coqui-tts itself does NOT declare torch/torchaudio/torchcodec as install
# dependencies (same reasoning as the `training` extra below: a GPU build must
# match the user's own CUDA, so it can't be hard-pinned here) but genuinely needs
# all three at import time — torchaudio for audio IO, torchcodec because torch>=2.9
# moved audio codecs off the old backends. Unpinned here so a normal `pip install`
# resolves current mutually-compatible versions together; if torch was already
# installed ahead of the latest published torchaudio/torchcodec (bleeding-edge
# torch, e.g. a nightly), install the matching build manually from
# https://download.pytorch.org/whl/<your-cuda-tag> — same pattern documented next
# to `torch` in requirements.txt.
clone = [
    "torch>=2.0",
    "torchaudio",
    "torchcodec",
    "coqui-tts>=0.24",
    # coqui-tts imports GPT2PreTrainedModel from the transformers top-level
    # namespace (TTS/tts/layers/tortoise/autoregressive.py) and XTTS-v2 uses GPT-2
    # as its text encoder. transformers 5.15 no longer exports it, so an unpinned
    # resolve took 5.15.0 in CI and the frozen app died with "Could not import
    # module 'GPT2PreTrainedModel'" — three releases shipped an unusable engine
    # before the packaged selftest surfaced it. In a source install 5.8.1 (the lock's version
    # for the rest of ELI) does work end-to-end through ELI's runtime shim (register a clone,
    # synthesise 24 kHz audio from it); a packaged build cannot use it, as follows.
    # MUST stay below 5. coqui-tts imports `isin_mps_friendly` from
    # transformers.pytorch_utils, which 5.x removed. ELI ships a runtime shim for
    # that, but PyInstaller's collect_submodules imports the package in an ISOLATED
    # SUBPROCESS where no in-process shim applies — so with transformers 5.x the
    # build silently logged "Failed to collect submodules for 'TTS'" and produced an
    # AppImage whose neural engine could not load. Pinning below 5 makes `import
    # TTS` work unaided, which is what the build-time collection needs.
    "transformers>=4.40,<5",
]
# Aliases for the same neural-voice dependency (clearer intent at install time).
natural = [
    "torch>=2.0",
    "torchaudio",
    "torchcodec",
    "coqui-tts>=0.24",
    # coqui-tts imports GPT2PreTrainedModel from the transformers top-level
    # namespace (TTS/tts/layers/tortoise/autoregressive.py) and XTTS-v2 uses GPT-2
    # as its text encoder. transformers 5.15 no longer exports it, so an unpinned
    # resolve took 5.15.0 in CI and the frozen app died with "Could not import
    # module 'GPT2PreTrainedModel'" — three releases shipped an unusable engine
    # before the packaged selftest surfaced it. In a source install 5.8.1 (the lock's version
    # for the rest of ELI) does work end-to-end through ELI's runtime shim (register a clone,
    # synthesise 24 kHz audio from it); a packaged build cannot use it, as follows.
    # MUST stay below 5. coqui-tts imports `isin_mps_friendly` from
    # transformers.pytorch_utils, which 5.x removed. ELI ships a runtime shim for
    # that, but PyInstaller's collect_submodules imports the package in an ISOLATED
    # SUBPROCESS where no in-process shim applies — so with transformers 5.x the
    # build silently logged "Failed to collect submodules for 'TTS'" and produced an
    # AppImage whose neural engine could not load. Pinning below 5 makes `import
    # TTS` work unaided, which is what the build-time collection needs.
    "transformers>=4.40,<5",
]
voice = [
    "torch>=2.0",
    "torchaudio",
    "torchcodec",
    "coqui-tts>=0.24",
    # coqui-tts imports GPT2PreTrainedModel from the transformers top-level
    # namespace (TTS/tts/layers/tortoise/autoregressive.py) and XTTS-v2 uses GPT-2
    # as its text encoder. transformers 5.15 no longer exports it, so an unpinned
    # resolve took 5.15.0 in CI and the frozen app died with "Could not import
    # module 'GPT2PreTrainedModel'" — three releases shipped an unusable engine
    # before the packaged selftest surfaced it. In a source install 5.8.1 (the lock's version
    # for the rest of ELI) does work end-to-end through ELI's runtime shim (register a clone,
    # synthesise 24 kHz audio from it); a packaged build cannot use it, as follows.
    # MUST stay below 5. coqui-tts imports `isin_mps_friendly` from
    # transformers.pytorch_utils, which 5.x removed. ELI ships a runtime shim for
    # that, but PyInstaller's collect_submodules imports the package in an ISOLATED
    # SUBPROCESS where no in-process shim applies — so with transformers 5.x the
    # build silently logged "Failed to collect submodules for 'TTS'" and produced an
    # AppImage whose neural engine could not load. Pinning below 5 makes `import
    # TTS` work unaided, which is what the build-time collection needs.
    "transformers>=4.40,<5",
]

[project.urls]
Homepage = "https://github.com/ShadowESC95/ELI_v2.0"
Repository = "https://github.com/ShadowESC95/ELI_v2.0"

[project.scripts]
# eli/__main__.py reads the flags (--license, --headless, --mcp-server, --mcp-config, --trust-agent)
# and otherwise starts the window; pointed at the window itself, these commands ignored every flag.
eli = "eli.__main__:main"
"eli-v2.0" = "eli.__main__:main"
eli-cli = "eli.__main__:main"
eli-mcp = "eli.integrations.mcp.server:main"
eli-jobs = "eli.planning.jobqueue_cli:main"

[project.gui-scripts]
eli-gui = "eli.gui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["eli*"]
exclude = ["tests*", "ops*", "build*"]

[tool.setuptools.package-data]
"eli" = [
    "**/*.json",
    "**/*.yaml",
    "**/*.yml",
    "**/*.txt",
    "**/*.toml",
    "**/*.cfg",
    "**/*.md",
    "tools/image_engine/presets/*.json",
    "tools/image_engine/config/*.json",
    "plugins/registry/*.json",
    "cognition/persona*.txt",
]

# Never let dev-tooling / dot-directories (.claude, .git, caches) get hoovered into the
# wheel by the broad **/*.json globs above — that leaked local paths/usernames once.
[tool.setuptools.exclude-package-data]
"eli" = [
    ".claude/*", "**/.claude/*",
    ".git/*", "**/.git/*",
    "**/.*/**",
    "**/__pycache__/*",
]
