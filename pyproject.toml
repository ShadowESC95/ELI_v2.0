[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eli-v2.0"
version = "2.3.20"
description = "ELI v2.0 — Local cognitive runtime, assistant GUI, memory, tools, and GGUF inference"
readme = "README.md"
requires-python = ">=3.10"
# Source-available (NOT open-source): use + modify for internal/personal use; no
# redistribution. Full terms in LICENSE. All commercial/distribution rights reserved.
license = "LicenseRef-PolyForm-Internal-Use-1.0.0"
authors = [{ name = "ELI Contributors" }]
keywords = ["ai", "assistant", "llm", "local", "gpu", "gguf"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: GPU :: NVIDIA CUDA",
    "Environment :: X11 Applications :: Qt",
]
dependencies = [
    "platformdirs>=4.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "requests>=2.28",
    "Pillow>=10.0",
    "mss>=9.0",
    "PyAutoGUI>=0.9.54",
    "pyttsx3>=2.9",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "psutil>=5.9",
    "tqdm>=4.64",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "numpy>=1.24",
    "faiss-cpu>=1.7",
    "tomli>=2.0.1; python_version<'3.11'",
    "comtypes>=1.2; sys_platform == 'win32'",
    "pycaw; sys_platform == 'win32'",
]

[project.optional-dependencies]
# GUI binding policy:
#   PySide6 is the canonical Qt binding for ELI. It is licensed LGPLv3,
#   which permits dynamic linking from proprietary or differently-licensed
#   code (Python always loads C extensions dynamically), so the binding
#   itself does not impose copyleft on the rest of this project.
#
#   PyQt6 is intentionally NOT a dependency here. PyQt6 is GPLv3 and would
#   force the entire shipped binary to be GPL, blocking proprietary
#   distribution. The runtime shim at eli/gui/qt_compat.py allows users
#   who already have PyQt6/PyQt5 installed to run from source, but the
#   packaged distribution must remain PySide6-only to honour the
#   project license declared above.
gui = [
    "PySide6>=6.5",
]
tts = [
    "piper-tts>=1.2",
    "onnxruntime>=1.15",
]
asr = [
    "faster-whisper>=1.0",
    "SpeechRecognition>=3.10",
    "PyAudio>=0.2",
    # audioop left the stdlib in 3.13 (PEP 594) and ELI's mic path imports it;
    # on 3.13+ distros it previously arrived only as a transitive dep.
    'audioop-lts>=0.2.1; python_version >= "3.13"',
]
llm = [
    "llama-cpp-python>=0.2",
]
image = [
    "diffusers>=0.20",
    "safetensors>=0.3",
    "accelerate>=0.20",
]
docs = [
    "markdown>=3.5",
    "pdfplumber>=0.10",
    "pypdf>=4.0",
    "python-docx>=1.1",
]
# Self-hosted REST + web chat UI (api/server.py) — the phone/web-app feature.
server = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "paho-mqtt>=1.6,<3",  # ELI-native MQTT device server (no Home Assistant)
    "zeroconf>=0.70",     # mDNS device/broker discovery
    "bleak>=0.21",        # Bluetooth (BLE) device discovery (degrades cleanly if no radio)
    "segno>=1.5",         # QR codes for Connect tab / phone pairing
    "cryptography>=41",   # self-signed LAN HTTPS cert (phone microphone)
]
# Gaze cursor + on-screen OCR.
vision = [
    "opencv-python>=4.8",
    "pytesseract>=0.3",
]
# Web search + browser automation plugins.
web = [
    "duckduckgo-search>=6.0",
    "playwright>=1.40",
]
# Data/CSV analysis + 2D/3D/4D plotting, simulation/dynamics, and 3D-mesh inspection.
# scipy = ODE/PDE solvers, linear algebra, signal processing (the "dynamics"); plotly
# = interactive 3D + time-animated (4D) figures; matplotlib(+mplot3d) = static 2D/3D;
# meshio = STL/VTK/OBJ mesh I/O. This is the stack ELI's code agent runs to build sims.
analysis = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "meshio>=5.3",
    "scipy>=1.11",
    "plotly>=5.18",
]
# Wake-word listening.
wakeword = [
    "openwakeword>=0.4",
]
# Misc runtime helpers: HF downloads, desktop notifications, calendar, code lint.
extras = [
    "huggingface-hub>=0.20",
    "plyer>=2.1",
    "ics>=0.7",
    "pyflakes>=3.0",
]
# Everything ELI uses at runtime — the one-click "complete" install.
full = [
    "eli-v2.0[gui,tts,asr,llm,image,docs,server,vision,web,analysis,wakeword,extras]",
]
# LoRA fine-tuning (heavy, opt-in — NOT part of full). See training/README.md.
training = [
    "torch>=2.0",
    "transformers>=4.40",
    "peft>=0.10",
    "datasets>=2.18",
    "trl>=0.8",
]
# Neural voice — Coqui XTTS-v2 (heavy, opt-in — NOT part of full). Powers BOTH the
# human-like `natural:` voices (built-in speakers, no clone) and `clone:` voice
# cloning. Downloads a ~1.8GB model on first use. See eli/perception/tts_xtts.py.
# coqui-tts is the maintained fork of the (unmaintained) TTS package; imports as `TTS`.
# coqui-tts itself does NOT declare torch/torchaudio/torchcodec as install
# dependencies (same reasoning as the `training` extra below: a GPU build must
# match the user's own CUDA, so it can't be hard-pinned here) but genuinely needs
# all three at import time — torchaudio for audio IO, torchcodec because torch>=2.9
# moved audio codecs off the old backends. Unpinned here so a normal `pip install`
# resolves current mutually-compatible versions together; if torch was already
# installed ahead of the latest published torchaudio/torchcodec (bleeding-edge
# torch, e.g. a nightly), install the matching build manually from
# https://download.pytorch.org/whl/<your-cuda-tag> — same pattern documented next
# to `torch` in requirements.txt.
clone = [
    "torch>=2.0",
    "torchaudio",
    "torchcodec",
    "coqui-tts>=0.24",
    # coqui-tts imports GPT2PreTrainedModel from the transformers top-level
    # namespace (TTS/tts/layers/tortoise/autoregressive.py) and XTTS-v2 uses GPT-2
    # as its text encoder. transformers 5.15 no longer exports it, so an unpinned
    # resolve took 5.15.0 in CI and the frozen app died with "Could not import
    # module 'GPT2PreTrainedModel'" — three releases shipped an unusable engine
    # before the packaged selftest surfaced it. 5.8.1 is verified working here
    # end-to-end (register a clone, synthesise 24 kHz audio from it).
    # MUST stay below 5. coqui-tts imports `isin_mps_friendly` from
    # transformers.pytorch_utils, which 5.x removed. ELI ships a runtime shim for
    # that, but PyInstaller's collect_submodules imports the package in an ISOLATED
    # SUBPROCESS where no in-process shim applies — so with transformers 5.x the
    # build silently logged "Failed to collect submodules for 'TTS'" and produced an
    # AppImage whose neural engine could not load. Pinning below 5 makes `import
    # TTS` work unaided, which is what the build-time collection needs.
    "transformers>=4.40,<5",
]
# Aliases for the same neural-voice dependency (clearer intent at install time).
natural = [
    "torch>=2.0",
    "torchaudio",
    "torchcodec",
    "coqui-tts>=0.24",
    # coqui-tts imports GPT2PreTrainedModel from the transformers top-level
    # namespace (TTS/tts/layers/tortoise/autoregressive.py) and XTTS-v2 uses GPT-2
    # as its text encoder. transformers 5.15 no longer exports it, so an unpinned
    # resolve took 5.15.0 in CI and the frozen app died with "Could not import
    # module 'GPT2PreTrainedModel'" — three releases shipped an unusable engine
    # before the packaged selftest surfaced it. 5.8.1 is verified working here
    # end-to-end (register a clone, synthesise 24 kHz audio from it).
    # MUST stay below 5. coqui-tts imports `isin_mps_friendly` from
    # transformers.pytorch_utils, which 5.x removed. ELI ships a runtime shim for
    # that, but PyInstaller's collect_submodules imports the package in an ISOLATED
    # SUBPROCESS where no in-process shim applies — so with transformers 5.x the
    # build silently logged "Failed to collect submodules for 'TTS'" and produced an
    # AppImage whose neural engine could not load. Pinning below 5 makes `import
    # TTS` work unaided, which is what the build-time collection needs.
    "transformers>=4.40,<5",
]
voice = [
    "torch>=2.0",
    "torchaudio",
    "torchcodec",
    "coqui-tts>=0.24",
    # coqui-tts imports GPT2PreTrainedModel from the transformers top-level
    # namespace (TTS/tts/layers/tortoise/autoregressive.py) and XTTS-v2 uses GPT-2
    # as its text encoder. transformers 5.15 no longer exports it, so an unpinned
    # resolve took 5.15.0 in CI and the frozen app died with "Could not import
    # module 'GPT2PreTrainedModel'" — three releases shipped an unusable engine
    # before the packaged selftest surfaced it. 5.8.1 is verified working here
    # end-to-end (register a clone, synthesise 24 kHz audio from it).
    # MUST stay below 5. coqui-tts imports `isin_mps_friendly` from
    # transformers.pytorch_utils, which 5.x removed. ELI ships a runtime shim for
    # that, but PyInstaller's collect_submodules imports the package in an ISOLATED
    # SUBPROCESS where no in-process shim applies — so with transformers 5.x the
    # build silently logged "Failed to collect submodules for 'TTS'" and produced an
    # AppImage whose neural engine could not load. Pinning below 5 makes `import
    # TTS` work unaided, which is what the build-time collection needs.
    "transformers>=4.40,<5",
]

[project.urls]
Homepage = "https://github.com/ShadowESC95/ELI_v2.0"
Repository = "https://github.com/ShadowESC95/ELI_v2.0"

[project.scripts]
eli = "eli.gui.app:main"
"eli-v2.0" = "eli.gui.app:main"
eli-cli = "eli.gui.app:main"

[project.gui-scripts]
eli-gui = "eli.gui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["eli*"]
exclude = ["tests*", "ops*", "build*"]

[tool.setuptools.package-data]
"eli" = [
    "**/*.json",
    "**/*.yaml",
    "**/*.yml",
    "**/*.txt",
    "**/*.toml",
    "**/*.cfg",
    "**/*.md",
    "tools/image_engine/presets/*.json",
    "tools/image_engine/config/*.json",
    "plugins/registry/*.json",
    "cognition/persona*.txt",
]

# Never let dev-tooling / dot-directories (.claude, .git, caches) get hoovered into the
# wheel by the broad **/*.json globs above — that leaked local paths/usernames once.
[tool.setuptools.exclude-package-data]
"eli" = [
    ".claude/*", "**/.claude/*",
    ".git/*", "**/.git/*",
    "**/.*/**",
    "**/__pycache__/*",
]
